# GoReleaser configuration.
# https://goreleaser.com
version: 2
project_name: where
before:
  hooks:
    - go mod download
    - mkdir -p completions
    - sh -c 'go run . completion bash > completions/where.bash'
    - sh -c 'go run . completion zsh > completions/_where'
    - sh -c 'go run . completion fish > completions/where.fish'
builds:
  - id: where
    main: .
    binary: where
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
archives:
  - files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - completions/*
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Tag }}-next'
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^style:'
homebrew_casks:
  - name: where
    directory: Casks
    repository:
      owner: icco
      name: homebrew-tap
      token: '{{ .Env.GH_PAT }}'
    homepage: https://github.com/icco/where
    description: Shared locations and local times for your people
    binaries:
      - where
    completions:
      bash: completions/where.bash
      zsh: completions/_where
      fish: completions/where.fish
    caveats: >-
      In zsh, use `command where` to bypass the shell's built-in `where`.
      Google uses imported Maps browser cookies. Apple requires a signed-in
      macOS Find My session and Accessibility/Automation permission.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/where"]
          end
release:
  github:
    owner: icco
    name: where
  mode: replace
  footer: |
    ---
    Install on macOS with `brew install --cask icco/tap/where`.
    Or use `go install github.com/icco/where@{{ .Tag }}`.

    **Full Changelog**: https://github.com/icco/where/compare/{{ .PreviousTag }}...{{ .Tag }}
