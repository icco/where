name: Test Go
on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "80"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v c="$total" -v t="$COVERAGE_THRESHOLD" \
            'BEGIN { if (c+0 < t+0) { exit 1 } }' || {
              echo "::error::coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            }
  apple-script:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check embedded macOS automation syntax
        run: osacompile -l JavaScript -o "$RUNNER_TEMP/findmy.scpt" internal/provider/findmy.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Accessibility fixtures
        run: node --test internal/provider/findmy_test.js
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: check
