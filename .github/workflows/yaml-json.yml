name: yaml-json
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-yamllint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        uses: dcarbone/install-yq-action@v1.3.1
      - name: Format YAML files with yq
        run: |
          # Format YAML in place. Skip vendor and node_modules in case they appear later.
          find . \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" | while read -r file; do
            echo "Formatting $file"
            yq -iP '.' "$file"
          done
      - name: Format JSON files with yq
        run: |
          # yq formats JSON with -o=json. go.sum is text, not JSON, so glob only *.json.
          find . -name "*.json" \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" | while read -r file; do
            echo "Formatting $file"
            yq -iP -o=json '.' "$file"
          done
      - name: Check formatting
        # Validate the PR merge checkout without switching branches or writing
        # commits; this also works for fork PRs and workflow YAML files.
        run: git diff --exit-code
