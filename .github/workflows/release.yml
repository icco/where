name: Release
on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify before tagging
        run: go test -race ./...
      - name: Check tap credentials
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Set GH_PAT with Contents write access to icco/homebrew-tap before releasing."
            exit 1
          fi
      - name: Determine next version
        if: github.ref_type != 'tag'
        id: versioning
        uses: PaulHatch/semantic-version@v6.0.4
        with:
          tag_prefix: v
          major_pattern: /!:|BREAKING CHANGE:/
          minor_pattern: /feat(\(.+\))?:/
          version_format: ${major}.${minor}.${patch}
      - name: Create and push tag
        if: github.ref_type != 'tag' && steps.versioning.outputs.changed == 'true'
        env:
          VERSION_TAG: ${{ steps.versioning.outputs.version_tag }}
        run: |
          # New projects start at v1.0.0, then follow semantic commit versions.
          if [ -z "$(git tag --list 'v*')" ]; then
            VERSION_TAG=v1.0.0
          fi
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"
      - name: Run GoReleaser
        if: github.ref_type == 'tag' || steps.versioning.outputs.changed == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
